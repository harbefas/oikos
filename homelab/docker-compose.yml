# Media stack for the homelab. Everything runs in containers, including
# Transmission, and every service mounts the SAME /media. Because downloads and
# the libraries live under one mount, paths match across containers and Radarr/
# Sonarr import with hardlinks -- no "remote path mapping" needed.
# PUID/PGID must match the user that owns /media (see bootstrap-arch.sh).

services:
  jellyfin:
    image: jellyfin/jellyfin:latest
    container_name: jellyfin
    restart: unless-stopped
    network_mode: host          # simplest for DLNA/discovery
    devices:
      - /dev/dri:/dev/dri       # Intel/AMD hardware transcoding
    group_add: ["video", "render"]
    volumes:
      - ./config/jellyfin:/config
      - /media:/media

  transmission:
    image: lscr.io/linuxserver/transmission:latest
    container_name: transmission
    restart: unless-stopped
    environment: ["PUID=${PUID}", "PGID=${PGID}", "TZ=${TZ}"]
    ports: ["9091:9091", "51413:51413", "51413:51413/udp"]
    volumes:
      - ./config/transmission:/config
      - /media:/media
    # download-dir is set to /media/downloads by stack-setup.sh (RPC session-set)

  radarr:
    image: lscr.io/linuxserver/radarr:latest
    container_name: radarr
    restart: unless-stopped
    environment: ["PUID=${PUID}", "PGID=${PGID}", "TZ=${TZ}"]
    ports: ["7878:7878"]
    volumes:
      - ./config/radarr:/config
      - /media:/media

  sonarr:
    image: lscr.io/linuxserver/sonarr:latest
    container_name: sonarr
    restart: unless-stopped
    environment: ["PUID=${PUID}", "PGID=${PGID}", "TZ=${TZ}"]
    ports: ["8989:8989"]
    volumes:
      - ./config/sonarr:/config
      - /media:/media

  lidarr:
    image: lscr.io/linuxserver/lidarr:latest
    container_name: lidarr
    restart: unless-stopped
    environment: ["PUID=${PUID}", "PGID=${PGID}", "TZ=${TZ}"]
    ports: ["8686:8686"]
    volumes:
      - ./config/lidarr:/config
      - /media:/media

  prowlarr:
    image: lscr.io/linuxserver/prowlarr:latest
    container_name: prowlarr
    restart: unless-stopped
    environment: ["PUID=${PUID}", "PGID=${PGID}", "TZ=${TZ}"]
    ports: ["9696:9696"]
    volumes:
      - ./config/prowlarr:/config

  bazarr:
    image: lscr.io/linuxserver/bazarr:1.5.1   # 1.6.0 has a broken missing_subtitles format
    container_name: bazarr
    restart: unless-stopped
    dns: ["1.1.1.1", "8.8.8.8"]                # some subtitle hosts resolve only over IPv6;
    sysctls: ["net.ipv6.conf.all.disable_ipv6=1"]  # force IPv4 so lookups don't fail
    environment: ["PUID=${PUID}", "PGID=${PGID}", "TZ=${TZ}"]
    ports: ["6767:6767"]
    volumes:
      - ./config/bazarr:/config
      - /media:/media

  jellyseerr:
    image: fallenbagel/jellyseerr:latest
    container_name: jellyseerr
    restart: unless-stopped
    environment: ["TZ=${TZ}"]
    ports: ["5055:5055"]
    volumes:
      - ./config/jellyseerr:/app/config

  flaresolverr:
    image: ghcr.io/flaresolverr/flaresolverr:latest
    container_name: flaresolverr
    restart: unless-stopped
    ports: ["8191:8191"]

  navidrome:
    image: deluan/navidrome:latest
    container_name: navidrome
    restart: unless-stopped
    environment:
      ND_MUSICFOLDER: /music
    ports: ["4533:4533"]
    volumes:
      - ./config/navidrome:/data
      - /media/music:/music:ro   # Lidarr writes, Navidrome only reads
