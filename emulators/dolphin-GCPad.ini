# Dolphin GameCube pad bindings para o gamepad virtual do hub.
# Copiar para ~/.config/dolphin-emu/GCPadNew.ini (com o Dolphin FECHADO).
# O pad e um joystick SDL (VID 4660/PID 22136), botoes 0-15 / eixos 0-3
# (mesma numeracao do HomelabVirtualGamepad.cfg do RetroArch). Dois pads iguais:
# P1 = SDL/0, P2 = SDL/1.
[GCPad1]
Device = SDL/0/Homelab Virtual Gamepad
Buttons/A = `Button 1`
Buttons/B = `Button 0`
Buttons/X = `Button 2`
Buttons/Y = `Button 3`
Buttons/Z = `Button 7`
Buttons/Start = `Button 9`
Main Stick/Up = `Axis 1-`
Main Stick/Down = `Axis 1+`
Main Stick/Left = `Axis 0-`
Main Stick/Right = `Axis 0+`
C-Stick/Up = `Axis 3-`
C-Stick/Down = `Axis 3+`
C-Stick/Left = `Axis 2-`
C-Stick/Right = `Axis 2+`
Triggers/L = `Button 4`
Triggers/R = `Button 5`
Triggers/L-Analog = `Button 4`
Triggers/R-Analog = `Button 5`
D-Pad/Up = `Button 12`
D-Pad/Down = `Button 13`
D-Pad/Left = `Button 14`
D-Pad/Right = `Button 15`

[GCPad2]
Device = SDL/1/Homelab Virtual Gamepad
Buttons/A = `Button 1`
Buttons/B = `Button 0`
Buttons/X = `Button 2`
Buttons/Y = `Button 3`
Buttons/Z = `Button 7`
Buttons/Start = `Button 9`
Main Stick/Up = `Axis 1-`
Main Stick/Down = `Axis 1+`
Main Stick/Left = `Axis 0-`
Main Stick/Right = `Axis 0+`
C-Stick/Up = `Axis 3-`
C-Stick/Down = `Axis 3+`
C-Stick/Left = `Axis 2-`
C-Stick/Right = `Axis 2+`
Triggers/L = `Button 4`
Triggers/R = `Button 5`
D-Pad/Up = `Button 12`
D-Pad/Down = `Button 13`
D-Pad/Left = `Button 14`
D-Pad/Right = `Button 15`
