# PCSX2 controller bindings for the hub's virtual gamepads (Pad1=SDL-0, Pad2=SDL-1).
# Append to ~/.config/PCSX2/inis/PCSX2.ini (with PCSX2 CLOSED - it overwrites on exit).
# The uinput pads must exist when PCSX2 starts (the hub creates them), so SDL-0/1 bind.

[InputSources]
SDL = true
SDLControllerEnhancedMode = false
XInput = false
DInput = false

[Pad1]
Type = DualShock2
Up = SDL-0/DPadUp
Right = SDL-0/DPadRight
Down = SDL-0/DPadDown
Left = SDL-0/DPadLeft
Triangle = SDL-0/Y
Circle = SDL-0/B
Cross = SDL-0/A
Square = SDL-0/X
Select = SDL-0/Back
Start = SDL-0/Start
L1 = SDL-0/LeftShoulder
R1 = SDL-0/RightShoulder
L2 = SDL-0/LeftTrigger
R2 = SDL-0/RightTrigger
L3 = SDL-0/LeftStick
R3 = SDL-0/RightStick
LUp = SDL-0/-LeftY
LDown = SDL-0/+LeftY
LLeft = SDL-0/-LeftX
LRight = SDL-0/+LeftX
RUp = SDL-0/-RightY
RDown = SDL-0/+RightY
RLeft = SDL-0/-RightX
RRight = SDL-0/+RightX

[Pad2]
Type = DualShock2
Up = SDL-1/DPadUp
Right = SDL-1/DPadRight
Down = SDL-1/DPadDown
Left = SDL-1/DPadLeft
Triangle = SDL-1/Y
Circle = SDL-1/B
Cross = SDL-1/A
Square = SDL-1/X
Select = SDL-1/Back
Start = SDL-1/Start
L1 = SDL-1/LeftShoulder
R1 = SDL-1/RightShoulder
L2 = SDL-1/LeftTrigger
R2 = SDL-1/RightTrigger
L3 = SDL-1/LeftStick
R3 = SDL-1/RightStick
LUp = SDL-1/-LeftY
LDown = SDL-1/+LeftY
LLeft = SDL-1/-LeftX
LRight = SDL-1/+LeftX
RUp = SDL-1/-RightY
RDown = SDL-1/+RightY
RLeft = SDL-1/-RightX
RRight = SDL-1/+RightX

